# Determine whether to allow the dev tool
# available value: 0(default),1(AngryGPS),2(SpotGnss)
GlueLayer_ToolConfigSelection=1

# Expose Autotest Ports, Default Disabled
#user_ports_tcp_name=Autotest
#user_ports_tcp_port=7555

# enable/disable debug log
# available value: 0(default),1
debug_enable=0

# Define GNSS debug folder, Default /data/vendor/gps
#debug_dir=/data/vendor/gps

# enable/disable Verbose Logging for rawbinlog.out
# available value: 0,1(default)
uni_log_verbose=1

# enable/disable SpotLogger
# available value: 0,1(default)
SpotLogger_Allowed=0

#enable/disable memdump logging
#available value: 0(default),1
mem_dump_enable=1

#enable/disable watchdog trigger when assert occurs
#available value: 0(default),1,2
#fault_scan_dump=0

# soft dog ms.
soft_dog=9000

#enable/disable watchdog skip by checking cp state(/dev/umts_boot0) and applied guard time for cp mailbox
#available value: 0(default),integer(sec)
wait_cp_boot_complete=3

#The following features only work under fault_scan_dump=2
#This cause GNSS WD if an assert of the specified count occurs within the specified time period.
#default value 0
#assert_count=3
#assert_time_ms=300000

# Define TLS version
## 0 - TLS_1_0
## 1 - TLS_1_1 (default)
## 2 - TLS_1_2
## 3 - SSLv23
## 4 - SSLv23_NO_TLSV1_2
Agnss_TlsVariant=4

# Define SHA version
## 0   - AUTO
## 1   - SHA1
## 256 - SHA256 (default)
Agnss_ShaVariant=0

# Define SGEE Download path
## 0 - Use only GNSSD to download SGEE
## 1 - Use only FW to download  (Default)
## 2 - Use Both
Sif_UseFwXtraInterface=0

# enable/disable SGEE
# available value: 0,1(default)
Sif_OperationMode=1

# enable/disable configinterface
# available value: 0,1(default)
GlueLayer_EnableGnssCfgInterface=1

# Codeload Signed Binaries
## 0 = Unsigned (Default)
## 2 = Signed
use_data_patch=2

# Specify RFIC ID for K43 (55400001 = S5540 EVT1)
gnss_rfic_chip_id=55400001

# Define value for Year_Of_HW, Default 0
GlueLayer_YearOfHW=2021

# enable/disable Android Scheduling capabilities
# available value: 0,1(default)
scheduling_enabled=1

# Define Aiding configuration
## Default - 0x0002004F
## 0x0001  - Precise Time
## 0x0002  - Coarse Time
## 0x0004  - Local Time
## 0x0008  - CP time
## 0x0010  - Freq Counter
## 0x0020  - Freq Non Counter
## 0x0040  - Freq Aiding On
### Freqency Ading accuracy is set in the 16 bits (0x00020000) is .2 ppm
Chip_Configuration_AidingConfiguration=0x00020046

# Enable MEMS
## Default - 0x0005
## 0x0001  - Accel Available
## 0x0004  - Gyro Available
## 0x0008  - Press Available
Chip_Configuration_mems_data_Configuration=13

# Available Constellations
## 0x0001 - GPS_ENABLE 
## 0x0002 - GLONASS_ENABLE 
## 0x0004 - GALILEO_ENABLE 
## 0x0008 - BEIDOU_ENABLE 
## 0x0010 - SBAS_ENABLE 
## 0x0020 - QZSS_ENABLE 
## 0x0040 - NAVIC_ENABLE 
## 0x0080 - L5_ENABLE 
## 0x2000 - MEMS_STATIC_ENABLE 
## 0x4000 - MEMS_HEADING_RATE_ENABLE 

# See above for Combinations
# Instruct the Reciever what it is capable of
Chip_Configuration_GNSSConstConstraintDef=0x60EF

# Instruct the SLL what Constellations are desired
LocTech_Constraints=0x60EF

# Need update by S.LSI
Chip_Configuration_RfMiscCtrl=0x80008001

# enable/disable native_set_position_mode
# available value: 0,1(default)
GlueLayer_EnableFwConfiguration=1

# Allow Ref Location only for Cold Starts
# available value: 0,1(default)
GlueLayer_isLocalRefLocInColdStart=1

# enable/disable non-framework (NFW) location access feature
# available value: 0,1(default)
GlueLayer_IsUseNfwLocAccess=1
# enable/disable NFW VisibilityControl feature
# available value: 0,1(default)
GlueLayer_IsUseNfwVCLocAccess=1
# used by the framework configuration interface to inform emergency status, not to be used in gps.cfg unless for simulation
# available value: 0(default),1
IsUeInEmergency=0
# Android Visibility Control package name for control plane
# Default - com.sec.location.nfwlocationprivacy
GlueLayer_VcPkgNameCP=com.sec.location.nfwlocationprivacy
# Android Visibility Control package name for user plane
# Default - com.sec.location.nfwlocationprivacy
GlueLayer_VcPkgNameUP=com.sec.location.nfwlocationprivacy

# NMEA Enablement Masks
# default 0x3FFF
## NMEA_RMC_MASK 0x000000010
## NMEA_GPRMC_BY_PS_POS_RSP_MASK 0x000000020
## NMEA_VTG_MASK 0x000000040
## NMEA_PSAMSA_MASK 0x000000080
## NMEA_SAMCLKSTATUS_MASK 0x000000100
## NMEA_PARITYERROR_MASK 0x000000200
## NMEA_PSSGR_MASK 0x000000400
## NMEA_EVENT_MASK 0x000000800
## NMEA_SAMID_MASK 0x000001000
## NMEA_SAMAID_MASK 0x000002000
## NMEA_CONSTANT_OUTPUT_MASK 0x010000000 /* special bit: when set, NMEA active even as total SV count low */
## SUPL_NMEA_EN_MASK 0x020000000
## NMEA_LOG_EN_MASK 0x040000000
## CP_NMEA_LOG_EN_MASK 0x080000000
## NMEA_GPDTM_MASK 0x100000000
## NMEA_GBS_MASK 0x200000000 /* all GP/GL/GA/GB/GI GBS or GNGBS */
## NMEA_GRS_MASK 0x400000000 /* all GP/GL/GA/GB/GI GRS or GNGRS */
## NMEA_GST_MASK 0x800000000 /* all GP/GL/GA/GB/GI GST or GNGST */
NmeaBitmask=0x20003FFF

# Enable MX Assert CallBack
# available value: 0(default),1
AssertBigData_Collect_Enable=1

# Define MX RF Loss value
RfPathLossDb_Ap=5
RfPathLossDb_Cp=5

# Define VDR Configuration
# High: highway, #Low:Parking lot
## Distance Default -  300
## Time Default     - 60
ChipCfg_VDR_high_end_Distance=300
ChipCfg_VDR_high_end_Time=60
ChipCfg_VDR_low_end_Distance=300
ChipCfg_VDR_low_end_Time=60

# HW geofence
## enable/disable HW geofence
## available value: 0(default),1
gf_enabled=0
## Geofence NOTIFRESPONSIVENESS_MS, Default = 0
notifResponsivenessMs=60000
## GeoFence UnavailableTimer, Default = 0
gf_UnavailableTimer=30
## GeoFence Unavailable Time out, Default = 60
gf_UnavailableTimeOutTime=420

# enable/disable DVS(Dynamic Voltage Scaling)
# available value: 0(default),1
Chip_Configuration_FeatureCfg_DVS = 1

# enable/disable DFS (Dynamic Frequency Scaling)
# available value: 0(default),1
Chip_Configuration_FeatureCfg_DFS = 1

# Make Android Provide Bluesky if capable and available
## 0    - Disabled (default)
## 0x01 - LineOfSight_SATS
## 0x02 - EXCESS_PATH_LENGTH
## 0x04 - REFLECTING_PLANE
#GlueLayer_MeasCorrCap=7

# Activate NAV usage of BlueSky eBearing real time
# available value: 0(default),1
#Chip_Configuration_FeatureCfg_ANDRD_MEAS_CORR_ENABLE=1

# Optionally specify DCXO Crystal type, and operation mode
# 8 bits.  Lower 4 bits Crystal ID# (0-15)
#          Upper 4 bits Poly Configuration: (0/1)
## 0 - Unknown/Default
## 1 - Kyocera CT1612RB
## 2 - NDK NX1612SD CS12311
## 3 - NDK NX1612SD CS13950
## 4 - NDK NX1612SD CS15298
## 5 - KDS 7CG07680A10
## 6-  TXC 0W76870003
## 7-  Kyocera CT1612RB (76800C0ZLHA5) - Root
Chip_Configuration_DCXO_CrystalType=0x17

# enable/disable UP LPP functionality
# available value: 0(default),1
SETCaps_IsLpp=1

# Define value UP LPPe functionality
## Default - 0x07
## 0x01    - LPPe DBH  
## 0x02    - LPPe UBP  
## 0x04    - LPPe WLAN 
Agnss_SuplLppeEnable=0

# spam_dog disable, default 30000
spam_dog_ms=0